[project]
name = "dmroute"
version = "0.1.0"
description = "Few-label LLM success prediction and routing with decision-model question features"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Dante de Prenda" }]

dependencies = [
  "numpy>=2.0",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "pyyaml>=6",
  "httpx>=0.27",
  "matplotlib>=3.8",
  "anthropic>=1.8.0",
]

[project.urls]
Repository = "https://github.com/dantedeprenda/routing-success-prediction"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
laya = ["laya>=0.1"]
embeddings = [
    "sentence-transformers>=3",
]

[project.scripts]
dmroute = "dmroute.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
src = ["src", "scripts"]

[tool.ruff.lint.isort]
known-first-party = ["dmroute"]

[tool.pytest.ini_options]
testpaths = ["tests"]
